name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]

jobs:
  codeql-python:
    name: CodeQL (Python)
    uses: molssi-seamm/devops/.github/workflows/CodeQL.yaml@main

  # The shared workflow above hardcodes its language matrix to ['python'],
  # with no input to extend it -- no sibling SEAMM package has a JS
  # frontend to need that. This mirrors its analyze job exactly, just for
  # javascript, so the React/TypeScript frontend gets scanned too.
  codeql-javascript:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript
          build-mode: none
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript"
