name: Release

on:
  release:
    types: [published]
    branches:
      - "main"

# The shared molssi-seamm/devops reusable Release.yaml bundles its
# lint-docs/test/deploy jobs into one opaque `uses:` call -- there's no way
# to inject a step into just one of them. Its `deploy` job needs the
# frontend built *before* `python -m build`, or the published wheel would
# ship without a UI (see seamm_webui/main.py's StaticFiles mount, which
# silently falls back to API-only when seamm_webui/static/ is empty). So
# this mirrors the shared workflow's lint-docs/test/deploy jobs verbatim
# (https://github.com/molssi-seamm/devops/blob/main/.github/workflows/Release.yaml)
# and adds only the frontend-build steps to `deploy`. It uses the shared workflow's uv
# path: this package has no conda CI environment (devtools/conda-envs/test_env.yaml).
jobs:
  lint-docs:
    name: Lint & Docs ubuntu-latest Py3.12
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Additional info about the build
      shell: bash
      run: |
        uname -a
        df -h
        ulimit -a
    # As the shared workflow's uv path: the package with its declared dependencies
    # (and its test and docs extras), so install_requires is what gets tested.
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install package (uv)
      shell: bash
      run: |
        uv venv --seed --python "$(which python)" .venv
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        uv pip install '.[test,docs]' pytest pytest-cov black flake8 codecov
        uv pip list
    - name: Run linters
      shell: bash -l {0}
      run: |
        make lint
    - name: Documentation
      shell: bash -l {0}
      run: |
        make html
    - name: Deploy documentation
      uses: peaceiris/actions-gh-pages@v4
      # Never block the PyPI publish (as devops#3)
      continue-on-error: true
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: docs/_build/html

  test:
    name: Test ${{ matrix.os }} Py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint-docs
    strategy:
      matrix:
        os: [macOS-latest, ubuntu-latest]
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@v5
    - name: Additional info about the build
      shell: bash
      run: |
        uname -a
        df -h
        ulimit -a
    # As the shared workflow's uv path: the package with its declared dependencies
    # (and its test and docs extras), so install_requires is what gets tested.
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - name: Install package (uv)
      shell: bash
      run: |
        uv venv --seed --python "$(which python)" .venv
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        uv pip install '.[test,docs]' pytest pytest-cov black flake8 codecov
        uv pip list
    - name: Run tests
      shell: bash -l {0}
      run: |
        pytest -v --doctest-modules --cov=seamm_webui --cov-report=xml --color=yes tests
    - name: CodeCov
      uses: codecov/codecov-action@v6
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}

  deploy:
    name: PyPi ubuntu-latest Py3.12
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags')
    runs-on: ubuntu-latest
    needs: [lint-docs, test]
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Build the frontend
      working-directory: frontend
      run: |
        npm ci
        npm run build
    - name: Set up Python "3.12"
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install package
      shell: bash -l {0}
      run: |
        python -m pip install . --no-deps
        python -m pip list
    - name: Install pypa/build
      run: |
        python -m pip install build --user
    - name: Build a binary wheel and a source tarball
      run: |
        python -m build --sdist --wheel --outdir dist/
        ls -l dist/
    - name: Publish distribution 📦 to Test PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.test_pypi_password }}
        repository-url: https://test.pypi.org/legacy/
        skip-existing: true
    - name: Publish distribution 📦 to PyPI
      if: contains(github.ref, 'dev') == false && contains(github.ref, 'rc') == false
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.pypi_password }}
