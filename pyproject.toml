[build-system]
requires = ["setuptools>=68", "wheel", "versioneer"]
build-backend = "setuptools.build_meta"

[project]
name = "seamm-webui"
dynamic = ["version"]
description = "SPA-based web dashboard for SEAMM"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [{ name = "Paul Saxe" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "seamm-datastore",
    "seamm-slurm",
    "fasteners",
    "itsdangerous",
    "python-multipart",
    "cryptography",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[project.scripts]
seamm-webui = "seamm_webui.main:run"
seamm-webui-user = "seamm_webui.manage:run"

[tool.setuptools.packages.find]
include = ["seamm_webui*"]

[tool.setuptools.package-data]
seamm_webui = ["static/**"]
