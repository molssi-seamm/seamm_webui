name: test
channels:
  - conda-forge
dependencies:
  # Base depends
  - python
  - pip

  # Runtime dependencies (conda-forge has all of these except
  # seamm-datastore, which is PyPI-only -- see the pip section below)
  - fastapi
  - uvicorn
  - itsdangerous
  - python-multipart
  - fasteners
  - cryptography
  - httpx

  # Testing
  - black
  - codecov
  - flake8
  - pytest
  - pytest-cov

  # Documentation
  - pydata-sphinx-theme
  - sphinx-design

  # Pip-only installs
  - pip:
    # seamm-datastore has no conda-forge package -- every SEAMM package
    # that depends on it pip-installs it the same way.
    - seamm-datastore

    # Documentation
    - sphinx-copybutton
