name: test
channels:
  - conda-forge
dependencies:
  # Base depends
  - python
  - pip

  # Runtime dependencies (conda-forge has all of these except
  # seamm-datastore, which is PyPI-only -- see the pip section below)
  - fastapi
  - uvicorn
  - itsdangerous
  - python-multipart
  - fasteners
  - cryptography
  - httpx

  # Testing
  - black
  - codecov
  - flake8
  - pytest
  - pytest-cov

  # Documentation
  - pydata-sphinx-theme
  - sphinx-design

  # Pip-only installs
  - pip:
    # seamm-datastore/seamm-slurm have no conda-forge package -- every
    # SEAMM package that depends on them pip-installs them the same way.
    # CI installs this package itself via `pip install . --no-deps` (see
    # Release.yaml), so pyproject.toml's own `dependencies` list is never
    # consulted -- everything actually needed at runtime/test time must be
    # listed here explicitly, not just in pyproject.toml.
    - seamm-datastore
    - seamm-slurm

    # Documentation
    - sphinx-copybutton
